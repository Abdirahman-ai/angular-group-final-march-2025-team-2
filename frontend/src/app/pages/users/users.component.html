<div class="users-page">
  <h1>Users</h1>
  <hr />

  <!-- Add User Button -->
  <div class="actions" *ngIf="isAdmin">
    <button class="add-user-btn" (click)="toggleUserForm()">+ Add User</button>
  </div>

  <!-- Admin Create User Form -->
  <div *ngIf="showUserForm" class="user-form">
    <input type="text" [(ngModel)]="newUser.firstName" placeholder="First Name" required />
    <input type="text" [(ngModel)]="newUser.lastName" placeholder="Last Name" required />
    <input type="email" [(ngModel)]="newUser.email" placeholder="Email" required />
    <input type="text" [(ngModel)]="newUser.phone" placeholder="Phone" required />
    <input type="text" [(ngModel)]="newUser.username" placeholder="Username" required />
    <input type="password" [(ngModel)]="newUser.password" placeholder="Password" required />

    <label class="admin-toggle">
      <input type="checkbox" [(ngModel)]="newUser.isAdmin" /> Admin
    </label>

    <button 
      class="create-user-btn"
      [disabled]="!isFormValid()" 
      (click)="createUser()"
    >
      Create
    </button>
  </div>

  <!-- User Table -->
  <div class="user-table">
    <div class="user-row header">
      <div>Name</div>
      <div>Email</div>
      <div>Phone</div>
      <div>Status</div>
      <div>Role</div>
    </div>

    <div class="user-row" *ngFor="let user of users">
      <div>{{ user.profile.firstName }} {{ user.profile.lastName }}</div>
      <div>{{ user.profile.email }}</div>
      <div>{{ user.profile.phone }}</div>
      <div>
        <span [ngClass]="{
          'status-joined': user.status === 'JOINED',
          'status-pending': user.status === 'PENDING'
        }">
          {{ user.status }}
        </span>
      </div>
      <div>
        <span *ngIf="user.admin" class="admin-badge">Admin</span>
        <span *ngIf="!user.admin">User</span>
      </div>
    </div>
  </div>
</div>
