<div class="projects-wrapper">
    <div>
        <span class="back-button" (click)="goBack()">&lt; Back</span>
    </div>
    <h2 class="page-title">Projects for Team {{ teamName }}</h2>

    <div class="projects-header">
        <button class="new-button" (click)="openCreateForm()">New</button>
    </div>

    <div *ngFor="let project of projects" class="project-row">
        <div class="project-info">
            <div class="project-title">
                {{ project.name }}
                <span class="status" [ngClass]="{ 'active': project.active, 'inactive': !project.active }">
                    {{ project.active ? 'Active' : 'Inactive' }}
                </span>
            </div>
            <div class="project-description">
                {{ project.description }}
            </div>
        </div>
        <button class="edit-button" (click)="editProject(project)">Edit</button>
    </div>
</div>

<div class="modal-overlay" *ngIf="showCreateForm">
    <div class="modal">
        <div class="modal-header">
            <span>Create Project</span>
            <span class="close-button" (click)="closeCreateForm()">&#x2715;</span>
        </div>

        <div class="modal-body">
            <label>Project Name</label>
            <input type="text" [(ngModel)]="newProject.name" />

            <label>Description</label>
            <input type="text" [(ngModel)]="newProject.description" />

            <button class="submit-button" (click)="submitNewProject()">Submit</button>
        </div>
    </div>
</div>

<div class="modal-overlay" *ngIf="showEditModal">
    <div class="modal" *ngIf="editedProject">
        <div class="modal-header">
            <span>Edit Project</span>
            <span class="close-button" (click)="showEditModal = false">&#x2715;</span>
        </div>

        <div class="modal-body">
            <label>Project Name</label>
            <input type="text" [(ngModel)]="editedProject!.name" placeholder="Project Name" />

            <label>Description</label>
            <input type="text" [(ngModel)]="editedProject!.description" placeholder="Description" />

            <label>Active?</label>
            <select [(ngModel)]="editedProject.active">
                <option [ngValue]="true">Yes</option>
                <option [ngValue]="false">No</option>
            </select>

            <button class="submit-button" (click)="saveEditedProject()">Save</button>

            <button class="delete-project-button" (click)="deleteProject(editedProject!.id)">Delete Project</button>
        </div>
    </div>
</div>
